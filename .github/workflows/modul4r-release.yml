name: RemoteAccess release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 1.5.0-remote1)"
        required: true
        default: "1.5.0-remote1"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}

  rename:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets to RemoteAccess-*
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          REL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq '.id')
          gh api "repos/${GITHUB_REPOSITORY}/releases/$REL" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              rustdesk-*) new="RemoteAccess-${name#rustdesk-}" ;;
              *) continue ;;
            esac
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/$id" -f name="$new" --jq '.name'
          done
