<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3229"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#a3712c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- back screen -->
  <g filter="url(#soft)">
    <rect x="196" y="268" width="452" height="308" rx="36" fill="#241d15" stroke="url(#gold)" stroke-width="20"/>
    <rect x="236" y="308" width="372" height="228" rx="20" fill="#171310"/>
  </g>
  <!-- back screen stand -->
  <path d="M 400 576 h 44 v 48 h -44 z M 348 624 h 148 v 34 h -148 z" fill="#241d15" stroke="url(#gold)" stroke-width="10"/>
  <!-- front screen, overlapping lower-right -->
  <g filter="url(#soft)">
    <rect x="424" y="428" width="404" height="276" rx="36" fill="#241d15" stroke="url(#gold)" stroke-width="20"/>
    <rect x="464" y="468" width="324" height="196" rx="20" fill="#171310"/>
  </g>
  <!-- link (chain) centered between the two screens -->
  <g transform="translate(512,412) rotate(-45)" filter="url(#soft)">
    <rect x="-160" y="-46" width="196" height="92" rx="46" fill="none" stroke="url(#gold)" stroke-width="30"/>
    <rect x="-36" y="-46" width="196" height="92" rx="46" fill="none" stroke="url(#gold)" stroke-width="30"/>
  </g>
</svg>
